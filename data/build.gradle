//file:noinspection GrUnresolvedAccess
plugins {
    alias libs.plugins.android.library
    alias libs.plugins.jetbrains.kotlin.android
}

android {
    //noinspection GroovyAssignabilityCheck
    //noinspection GrDeprecatedAPIUsage
    compileSdkVersion rootProject.compile_sdk_version
    //noinspection GroovyAssignabilityCheck
    //noinspection GrDeprecatedAPIUsage
    buildToolsVersion rootProject.build_tools_version

    //noinspection GroovyAssignabilityCheck
    defaultConfig {
        minSdkVersion rootProject.min_sdk_version
        buildConfigField "String", "HOST_URL", "\"${rootProject.HOST_URL}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    //noinspection GroovyAssignabilityCheck
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
    //noinspection GroovyAssignabilityCheck
    //noinspection GroovyMissingReturnStatement
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'io.github.turskyi.data'
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        targetSdk 36
    }
    lint {
        targetSdk 36
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    /* data module which is the inner (lower) layer of the project knows only about domain layer
     * (a layer with interfaces which communicates with outer (top) level of the project ) */
    implementation project(':domain')

    // Koin for Android
    api(libs.koin.android.v410)
    // Koin core features
    api("io.insert-koin:koin-core:$koin_core_version")

    // network
    api "com.squareup.okhttp3:okhttp:$okhttp_version"
    api libs.logging.interceptor
    api libs.retrofit
    api libs.converter.gson
    api libs.gson
    api libs.java.jwt

    // Preferences DataStore (SharedPreferences like APIs)
    implementation(libs.datastore.preferences)
    implementation libs.core.ktx

    // test
    testImplementation libs.junit
    androidTestImplementation libs.junit.v121
    androidTestImplementation libs.espresso.core.v361
}