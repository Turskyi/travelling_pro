workflows:
  release-workflow:
    name: Publish to Google Play
    max_build_duration: 60
    environment:
      android_signing:
        - travelling_pro_keystore_reference
      groups:
        - google-play
      vars:
        PACKAGE_NAME: "io.github.turskyi.travellingpro"
        HOST_URL: "https://raw.githubusercontent.com/"
        SIGNING_KEY_DEBUG_PATH: "$CM_BUILD_DIR/keystore/travelling_debug.keystore"
        SIGNING_KEY_RELEASE_PATH: "$CM_BUILD_DIR/keystore/travelling_release.keystore"
        # Path to Java 17.
        JAVA_HOME: /Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Restore signing keystore files
        script: |
          mkdir -p "$CM_BUILD_DIR/keystore"
          echo "$SIGNING_KEY_DEBUG_BASE64" | base64 --decode > "$SIGNING_KEY_DEBUG_PATH"
          echo "$SIGNING_KEY_RELEASE_BASE64" | base64 --decode > "$SIGNING_KEY_RELEASE_PATH"
      - ./gradlew bundleRelease
    artifacts:
      - presentation/build/outputs/bundle/release/presentation-release.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production